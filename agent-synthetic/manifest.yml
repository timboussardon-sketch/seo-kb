# Manifest de schéma SyntheticBrain
# L'agent lit ce fichier en premier pour savoir quelle mémoire fait foi.

schema_version: 2

source_of_truth:
  editions: revuedepressIA/  # éditions produites, {date}-revue-presse[-vN].md, suivi git
  memory: memory/          # interprétations durables, ne changent qu'après revue humaine
  event_ledgers: ledgers/  # faits observés, append-only
  derived_views: derived/  # vues calculées à partir des ledgers

# Fichiers historiques à la racine de agent-synthetic/ (schema v1).
# Lus en fallback tant que la migration n'est pas stable, jamais écrits.
legacy_root_files: deprecated

# Règle de migration (en cours) :
#   1. L'agent LIT la nouvelle structure en priorité, fallback sur l'ancienne si absente.
#   2. L'agent ÉCRIT uniquement dans la nouvelle structure.
#   3. Les fichiers legacy racine ne sont supprimés qu'après 2-3 runs stables sur v2.
migration:
  status: done                      # migration supervisée le 2026-05-30, validée par validate.sh
  reads: new-first-then-legacy      # fallback legacy conservé dans le skill par sécurité
  writes: new-only
  legacy_root_files_removed: true   # supprimés en un passage supervisé (plus de double mémoire)
  reconciled_cloud_run: "2026-05-30-cloud"
  stable_runs_done: 16              # +1 run 2026-06-08-v2 (pilier Product-Led SEO, info du jour etude Averi 8 juin 2026 sur 12 mois GSC d'un SaaS B2B : 711 pages a >=1000 impressions / 97,7% sous 1% CTR / 12,6M impressions / 30 254 clics / CTR moyen 0,24% / page la plus degradee AirOps alternatives 0,02% / page /customers 0,03% / motif macro corrobore par Seer Interactive avril 2026 + Ahrefs 2026 / lecture doctrinale : distinction PLS strict (pages-fonctionnalite interactives, calculateur/simulateur/configurateur/generateur) vs PLS large (pages-marketing produit, comparatifs editoriaux, temoignages) / filtre 80% test-substitution-llm tient avec appui empirique indirect ; 3 breves : audience 9e Circuit 11 juin Amazon-Perplexity Seattle docket 26-1444 + amici News/Media Alliance + DCN 259M visiteurs uniques + ACLU Premier Amendement / Semrush MCP connector Perplexity Computer 3 juin 28,4Md keywords / Eli Schwartz Hiring AEO 4 juin profil product manager ; resolution partielle P-2026-06-06-v3-2 ; nouvelle prediction P-2026-06-08-v2-1 sur eligibilite empirique distinction PLS strict/large ; source nouvelle explore productledseo.com 0.8 ; natif v2, validate.sh passe)

# Validation : tout .jsonl doit parser ligne par ligne avant commit (voir validate.sh).
integrity:
