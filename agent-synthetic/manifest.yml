# Manifest de schéma SyntheticBrain
# L'agent lit ce fichier en premier pour savoir quelle mémoire fait foi.

schema_version: 2

source_of_truth:
  editions: revuedepressIA/  # éditions produites, {date}-revue-presse[-vN].md, suivi git
  memory: memory/          # interprétations durables, ne changent qu'après revue humaine
  event_ledgers: ledgers/  # faits observés, append-only
  derived_views: derived/  # vues calculées à partir des ledgers

# Fichiers historiques à la racine de agent-synthetic/ (schema v1).
# Lus en fallback tant que la migration n'est pas stable, jamais écrits.
legacy_root_files: deprecated

# Règle de migration (en cours) :
#   1. L'agent LIT la nouvelle structure en priorité, fallback sur l'ancienne si absente.
#   2. L'agent ÉCRIT uniquement dans la nouvelle structure.
#   3. Les fichiers legacy racine ne sont supprimés qu'après 2-3 runs stables sur v2.
migration:
  status: done                      # migration supervisée le 2026-05-30, validée par validate.sh
  reads: new-first-then-legacy      # fallback legacy conservé dans le skill par sécurité
  writes: new-only
  legacy_root_files_removed: true   # supprimés en un passage supervisé (plus de double mémoire)
  reconciled_cloud_run: "2026-05-30-cloud"
  stable_runs_done: 6               # +1 run du 2026-06-01-v3 (pilier Product-Led SEO en info du jour, natif v2, validate.sh passé)

# Validation : tout .jsonl doit parser ligne par ligne avant commit (voir validate.sh).
integrity:
  jsonl_validation: required
  validator: ./validate.sh

ledgers:
  runs.jsonl: { capture_mode_field: required }       # native | reconstructed_from_run
  claims.jsonl: { capture_mode_field: required }
  sources.jsonl: {}
  headlines.jsonl: {}
  predictions.jsonl: {}
  mistakes.jsonl: {}
  said_index.jsonl: {}
  engagement.jsonl: {}
